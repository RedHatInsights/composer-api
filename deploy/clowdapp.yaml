---
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  annotations:
    description: Composer API service for Red Hat Insights
  name: composer-api
parameters:
  - name: ENV_NAME
    value: env-composer-api
  - name: REPLICAS
    value: '1'
  - name: IMAGE
    value: quay.io/redhat-user-workloads/teamnado-konflux-tenant/composer-api
  - name: IMAGE_TAG
    value: latest
  - name: MEMORY_REQUEST
    value: 128Mi
  - name: MEMORY_LIMIT
    value: 256Mi
  - name: CPU_REQUEST
    value: 100m
  - name: CPU_LIMIT
    value: 500m
  - name: FEATURE_SERVICE_URL
objects:
- apiVersion: cloud.redhat.com/v1alpha1
  kind: ClowdApp
  metadata:
    name: composer-api
    labels:
      app: composer-api
  spec:
    envName: ${ENV_NAME}
    database:
      name: composer
      version: 16
    deployments:
      - name: service
        webServices:
          public:
            enabled: true
            apiPath: subscription-composer
        replicas: ${{REPLICAS}}
        podSpec:
          image: ${IMAGE}:${IMAGE_TAG}
          env:
            - name: FEATURE_SERVICE_URL
              value: ${FEATURE_SERVICE_URL}
            - name: FEATURE_SERVICE_CERT_PATH
              value: /etc/composer-api/tls/tls.crt
            - name: FEATURE_SERVICE_KEY_PATH
              value: /etc/composer-api/tls/tls.key
            - name: FEATURE_SERVICE_CA_CERT_PATH
              value: /etc/composer-api/tls/ca.pem
          initContainers:
            - name: run-migrations
              inheritEnv: true
              command:
                - /bin/bash
                - /migrate.sh
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
          volumes:
          - name: config
            configMap:
              name: composer-api-config
          - name: tls-certs
            secret:
              secretName: composer-api-certificate
              items:
                - key: tls.crt
                  path: tls.crt
                - key: tls.key
                  path: tls.key
                - key: ca.pem
                  path: ca.pem
          volumeMounts:
          - name: config
            mountPath: /etc/composer-api
          - name: tls-certs
            mountPath: /etc/composer-api/tls
            readOnly: true
          livenessProbe:
            httpGet:
              path: /ping
              port: web
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: web
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          resources:
            requests:
              cpu: ${CPU_REQUEST}
              memory: ${MEMORY_REQUEST}
            limits:
              cpu: ${CPU_LIMIT}
              memory: ${MEMORY_LIMIT}
- apiVersion: v1
  kind: ConfigMap
  metadata:
    name: composer-api-config
  data:
    config.yaml: |
      server:
        port: "8000"
        allowed_origins:
          - "*"
        cors_max_age: 3600
        max_body_bytes: 1048576
      log:
        level: "info"
        pretty: false
